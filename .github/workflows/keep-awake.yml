# Keeps the free Supabase project awake: one small, real database request every two days.
# A free project is paused after 7 days with little activity; a paused project answers nothing,
# so the dashboard and every app inside it would stop saving.
#
# What it does: scripts/keep-awake.mjs calls the database function is_company_member with the
# PUBLIC anon key. The function is closed to anon, so Postgres itself answers "permission
# denied" (code 42501): only a running database can give that answer, and nothing is read.
# If the database does not answer (paused, wrong key), the run FAILS, and GitHub emails
# whoever last changed the schedule line below.
#
# Settings (the same names the deploy workflow uses; set them once, under
# Settings > Secrets and variables > Actions, as Variables or as Secrets):
#     VITE_SUPABASE_URL        your Supabase project URL
#     VITE_SUPABASE_ANON_KEY   the project's PUBLIC anon key (never any other key)
#
# GitHub's 60-day rule: in a public repository, scheduled workflows are switched off after 60
# days without activity in the repository. The second step fails this job from 45 days after the
# last commit, so GitHub's failure email arrives while there is still time: push any commit to
# reset the count. If it has already been switched off: Actions > Keep Supabase awake >
# "Enable workflow".
#
# Schedules run only from the default branch: this starts once the file is on main.

name: Keep Supabase awake

on:
  schedule:
    # 05:17 UTC on every odd day of the month (1, 3, 5, ... 31): never more than 2 days apart.
    - cron: "17 5 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    name: One small database request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No npm install: the script uses only Node and src/safety/keepAwake.ts.
      - name: Ask the database one small question
        run: node scripts/keep-awake.mjs

      - name: Warn before GitHub's 60-day rule switches this schedule off
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/commits?per_page=1" --jq '.[0].commit.committer.date')
          node --input-type=module -e "
            import { judgeLastCommit } from './src/safety/keepAwake.ts';
            const verdict = judgeLastCommit(process.argv[1], new Date());
            if (verdict.warn) { console.log('::error::' + verdict.reason); process.exit(1); }
            console.log(verdict.reason);
          " "$last"
